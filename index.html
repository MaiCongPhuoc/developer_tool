<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: Google Search KHÔNG hỗ trợ SVG và yêu cầu ảnh VUÔNG (1:1), nên
         ngoài bản SVG (cho trình duyệt) còn có favicon.ico và PNG vuông 192x192
         (bội của 48px) cho Google. Logo gốc 564x442 không vuông nên các file này
         được đệm nền trong suốt cho vuông. Giữ nguyên tên/đường dẫn file (Google
         yêu cầu URL favicon ổn định). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/images/logo/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Xác minh quyền sở hữu trang web với Google AdSense (cách "Thẻ meta").
         Chỉ là thẻ meta khai báo mã publisher - KHÔNG nạp script quảng cáo nào.
         Quảng cáo chỉ được nạp khi điền mã ô quảng cáo trong
         src/util/adsenseConfig.ts. -->
    <meta name="google-adsense-account" content="ca-pub-5609859335617137" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Tool – Free Online Developer Utilities</title>
    <meta
      name="description"
      content="Free browser-based developer tools: JSON/XML/SQL formatters, encryption, UUID and password generators, QR codes, regex tester, unit and color converters, image and document converters, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Developer Tool" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
